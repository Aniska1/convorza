<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convorza AI - Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f4f8; margin: 0; }
  header { background: #4f46e5; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; margin-left: 16px; }
  .wrap { max-width: 900px; margin: 20px auto; padding: 0 12px; }
  select { padding: 8px; font-size: 15px; margin-bottom: 14px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { flex: 1; min-width: 130px; background: #fff; border-radius: 10px; padding: 14px; border: 1px solid #ddd; }
  .card b { display: block; font-size: 28px; color: #4f46e5; }
  h3 { margin: 22px 0 8px; }
  .bar { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
  .fill { background: #4f46e5; height: 10px; border-radius: 5px; margin-top: 5px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #ddd; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: top; }
  th { background: #eceefb; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .escalation { background: #fde2e2; color: #b42318; }
  .request { background: #e0f2e9; color: #1a7f4b; }
</style>
</head>
<body>
<header>
  <b>Convorza AI - Owner Dashboard</b>
  <span><a href="/">Chat</a><a href="/dashboard.html">Dashboard</a></span>
</header>
<div class="wrap">
  <label>Business: <select id="biz"></select></label>
  <div class="cards">
    <div class="card"><b id="chats">0</b>Chats</div>
    <div class="card"><b id="messages">0</b>Customer messages</div>
    <div class="card"><b id="requests">0</b>Requests</div>
    <div class="card"><b id="escalations">0</b>Escalated to human</div>
  </div>
  <h3>Top customer problems</h3>
  <div id="problems"></div>
  <h3>Recent requests and tickets</h3>
  <table>
    <thead><tr><th>ID</th><th>Type</th><th>Category</th><th>Details</th><th>Time</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
const sel = document.getElementById("biz");
const selectedBusiness = sessionStorage.getItem("convorza_demo_business");
function set(id, v) { document.getElementById(id).textContent = v; }

async function load() {
  const d = await (await fetch("/api/dashboard/" + sel.value)).json();
  set("chats", d.chats); set("messages", d.messages); set("requests", d.requests);
  set("escalations", d.escalations);
  const p = document.getElementById("problems");
  p.innerHTML = "";
  const max = Math.max(1, ...d.top_problems.map(x => x.n));
  if (!d.top_problems.length) p.textContent = "No requests yet.";
  d.top_problems.forEach(x => {
    const div = document.createElement("div");
    div.className = "bar";
    div.innerHTML = "<b></b> (" + x.n + ")<div class='fill' style='width:" + (x.n / max * 100) + "%'></div>";
    div.querySelector("b").textContent = x.request_type;
    p.appendChild(div);
  });
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  d.recent.forEach(r => {
    const tr = document.createElement("tr");
    const cells = [r.id, r.kind, r.request_type, r.details, r.created_at];
    cells.forEach((c, i) => {
      const td = document.createElement("td");
      if (i === 1) {
        const s = document.createElement("span");
        s.className = "tag " + c; s.textContent = c; td.appendChild(s);
      } else { td.textContent = c; }
      tr.appendChild(td);
    });
    rows.appendChild(tr);
  });
}

fetch("/api/businesses").then(r => r.json()).then(list => {
  list.forEach(b => {
    const o = document.createElement("option");
    o.value = b.id; o.textContent = b.business_name;
    sel.appendChild(o);
  });
    if (selectedBusiness && list.some(b => b.id === selectedBusiness)) {
    sel.value = selectedBusiness;
  }

  sel.onchange = load;
  load();
  setInterval(load, 5000);
});
</script>
</body>
</html>
